name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # A real Postgres service, matching production's database backend, is
    # available here for any test that needs it (e.g. future integration and
    # sync-partition suites) -- see docs/13-testes-e-qualidade.md §13.5. The
    # default test suite itself still runs against SQLite in memory
    # (config.settings.test) for speed and does not depend on this service.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fenixschool
          POSTGRES_USER: fenixschool
          POSTGRES_PASSWORD: fenixschool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fenixschool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: pip install -r requirements/dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Dependency vulnerability audit
        run: pip-audit

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=70

      - name: Sync-partition tests (simulated network partition)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: pytest tests/sync_partition -m sync

      - name: Build the Docker image
        run: docker build -t fenixschool:ci .
