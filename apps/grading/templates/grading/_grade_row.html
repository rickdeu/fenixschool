{% load i18n %}
<form class="d-flex align-items-center gap-2"
      hx-post="{% url 'grading:grade_cell_save' %}"
      hx-target="this" hx-swap="outerHTML">
    {% csrf_token %}
    <input type="hidden" name="enrollment" value="{{ enrollment.id }}">
    <input type="hidden" name="subject" value="{{ subject.id }}">
    <input type="hidden" name="evaluation_type" value="{{ evaluation_type.id }}">
    <input type="hidden" name="academic_term" value="{{ academic_term.id }}">
    <input type="number" step="0.1" min="0" max="20" name="value"
           class="form-control form-control-sm" style="max-width: 6rem;"
           value="{{ value|default_if_none:'' }}" required>
    <button type="submit" class="btn btn-sm btn-outline-primary">
        {% translate "Gravar" %}
    </button>
    {% if success %}
    <span class="text-success small"><i class="bi bi-check-circle-fill"></i> {% translate "Gravado" %}</span>
    {% elif error %}
    <span class="text-danger small"><i class="bi bi-exclamation-triangle-fill"></i> {{ error }}</span>
    {% endif %}
</form>
