[project]
name = "fenixschool"
version = "0.1.0"
description = "Sistema de gestão académica para instituições de Ensino Secundário em Angola."
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "*/migrations/*",
    ".venv",
    # Scripts administrativos/pontuais (ver CLAUDE.md) — contêm strings de dados longas
    # (ex. descrições de tarefas) que não se enquadram no limite de linha da aplicação.
    "scripts",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle (erros)
    "W",   # pycodestyle (avisos)
    "F",   # pyflakes
    "I",   # isort (ordenação de imports)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
]
ignore = [
    "DJ001",  # permite null=True em CharField/TextField (padrão comum no Django Admin)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["apps", "tests"]
addopts = "--reuse-db"
markers = [
    "sync: sync-partition tests that simulate a network partition (see docs/13-testes-e-qualidade.md)",
]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# RNF-MAN-03 (docs/03-requisitos-nao-funcionais.md §3.9): 70% minimum test
# coverage on the business core. Enforced in CI via
# `pytest --cov=apps --cov-fail-under=70` (see .github/workflows/ci.yml).
fail_under = 70
show_missing = true
